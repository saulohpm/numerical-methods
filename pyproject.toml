[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "numerical-methods"
description = "Educational Python solver for Numerical Analysis and Scientific Computing"
version = "0.7.6"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "saulohpm"}]

[project.urls]
Homepage = "https://github.com/saulohpm/NumericalMethods"
Repository = "https://github.com/saulohpm/NumericalMethods"
Documentation = "https://github.com/saulohpm/NumericalMethods#readme"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]